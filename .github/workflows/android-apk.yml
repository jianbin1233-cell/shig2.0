name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Drop invalid packages
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); for (const k of ["dependencies","devDependencies"]) { if(!p[k]) continue; delete p[k]["@capacitor-community/biometric"]; } fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use preinstalled Android SDK
        run: |
          SDK="\( {ANDROID_SDK_ROOT:- \){ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK" -type f -name sdkmanager | head -1)"
          echo "SDK=$SDK"
          echo "sdkmanager=$SM"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare www
        run: |
          mkdir -p www
          cp -f index.html sw.js manifest.webmanifest icon.svg www/ 2>/dev/null || true
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.html' \) -exec cp -f {} www/ \;
          test -f www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
